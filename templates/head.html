<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script src="__THEME_SCRIPT__"></script>
    <title>{{page.title}}</title>
    <meta name="description" content="{{page.description}}">
    <link rel="canonical" href="{{page.canonical}}">
    <link rel="icon" href="{{base identity.favicon}}">
    <link rel="preload" href="{{base 'assets/fonts/manrope-latin.woff2'}}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/styles.css">
    <meta property="og:title" content="{{page.title}}">
    <meta property="og:description" content="{{page.description}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{page.canonical}}">
    <meta property="og:image" content="{{openGraphImage}}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{page.title}}">
    <meta name="twitter:description" content="{{page.description}}">
    <meta name="theme-color" content="#f8faf9">
</head>
